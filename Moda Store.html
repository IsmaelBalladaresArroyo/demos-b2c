<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Moda Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');
:root{
  --bg:#0A0A0A;--bg2:#141414;--bg3:#1E1E1E;--fg:#FFF;--fg2:#A1A1A1;
  --accent:#A855F7;--accent2:#C084FC;--accent3:#7C3AED;
  --border:#2A2A2A;--radius:12px;--radius-sm:8px;
  --max-w:1200px;
  color-scheme:dark;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#FFF;--bg2:#F5F3FF;--bg3:#EDE9FE;--fg:#0A0A0A;--fg2:#525252;
  --accent:#9333EA;--accent2:#7C3AED;--accent3:#A855F7;--border:#E5E5E5;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#FFF;--bg2:#F5F3FF;--bg3:#EDE9FE;--fg:#0A0A0A;--fg2:#525252;
  --accent:#9333EA;--accent2:#7C3AED;--accent3:#A855F7;--border:#E5E5E5;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
.full-bleed{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.container{max-width:var(--max-w);margin:0 auto;width:100%}

/* TOPBAR ANIMATED */
.topbar{text-align:center;padding:8px 16px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;overflow:hidden;height:32px;position:relative}
.topbar-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(-100%);transition:none}
.topbar-msg.active{opacity:1;transform:translateY(0);animation:topbarIn .5s cubic-bezier(.34,1.56,.64,1)}
.topbar-msg.exit{opacity:0;transform:translateY(100%);animation:topbarOut .4s ease-in}
@keyframes topbarIn{0%{opacity:0;transform:translateY(-100%)}100%{opacity:1;transform:translateY(0)}}
@keyframes topbarOut{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(100%)}}

/* NAVBAR */
.navbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0;position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border)}
.nav-logo{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;cursor:pointer;letter-spacing:2px}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{color:var(--fg2);text-decoration:none;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:1px;transition:color .2s;cursor:pointer}
.nav-links a:hover,.nav-links a.active{color:var(--accent)}
.nav-icons{display:flex;gap:12px;align-items:center}
.nav-icons button{background:none;border:none;color:var(--fg);cursor:pointer;position:relative;padding:4px}
.badge-count{position:absolute;top:-4px;right:-6px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hamburger{display:none;background:none;border:none;color:var(--fg);cursor:pointer}
@media(max-width:768px){.nav-links{display:none}.hamburger{display:block}}

/* MOBILE MENU */
.mobile-menu{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;flex-direction:column;padding:80px 24px 24px}
.mobile-menu.open{display:flex}
.mobile-menu a{color:var(--fg);text-decoration:none;font-size:20px;font-weight:600;padding:16px 0;border-bottom:1px solid var(--border);cursor:pointer;display:block}
.mobile-menu .close-menu{position:absolute;top:24px;right:24px;background:none;border:none;color:var(--fg);cursor:pointer}
.mobile-menu-socials{display:flex;gap:12px;margin-top:auto;padding-top:20px;justify-content:center}
.mobile-menu-socials a{width:40px;height:40px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none;border:1px solid var(--border)}

/* HERO */
.hero{min-height:480px;display:flex;align-items:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0A0A0A 0%,#1a0a2e 50%,#0A0A0A 100%);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%,rgba(168,85,247,.15) 0%,transparent 60%)}
.hero-inner{display:flex;align-items:center;width:100%;max-width:var(--max-w);margin:0 auto;padding:60px 24px;position:relative;z-index:1;gap:40px}
.hero-text{flex:0 0 45%}
.hero-eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
.hero-title{font-family:'Playfair Display',serif;font-size:clamp(32px,5vw,52px);font-weight:700;line-height:1.1;margin-bottom:16px;color:#fff}
.hero-title em{font-style:italic;color:var(--accent2)}
.hero-desc{color:#A1A1A1;font-size:14px;margin-bottom:24px;max-width:360px}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:50px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;border:none;cursor:pointer;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.hero-trust{display:flex;gap:20px;flex-wrap:wrap}
.hero-trust-item{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.7)}
.hero-trust-item svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:1.5}
.hero-images{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px}
.hero-img-card{border-radius:var(--radius);overflow:hidden;aspect-ratio:3/4}
.hero-img-card img{width:100%;height:100%;object-fit:cover}
.hero-img-card:nth-child(2),.hero-img-card:nth-child(4){transform:translateY(24px)}
@media(max-width:768px){
  .hero{min-height:auto}
  .hero-inner{flex-direction:column;text-align:center;padding:40px 20px}
  .hero-text{flex:none}
  .hero-desc{margin:0 auto 24px}
  .hero-btns{justify-content:center}
  .hero-trust{justify-content:center}
  .hero-images{max-width:260px;gap:8px}
  .hero-img-card:nth-child(2),.hero-img-card:nth-child(4){transform:translateY(12px)}
}

/* CAROUSEL */
.carousel-wrap{position:relative}
.carousel-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;padding:4px 0}
.carousel-track::-webkit-scrollbar{display:none}
.carousel-track>*{scroll-snap-align:start;flex-shrink:0}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:5;transition:all .2s;font-size:18px;font-weight:700}
.carousel-arrow:hover{background:var(--accent2)}
.carousel-arrow.prev{left:-12px}
.carousel-arrow.next{right:-12px}
.carousel-arrow.visible{display:flex}

/* MARQUEE */
.marquee-section{padding:28px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden}
.marquee-title{text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--fg2);margin-bottom:16px}
.marquee-track{display:flex;gap:48px;animation:marquee 20s linear infinite;width:max-content}
.marquee-track:hover{animation-play-state:paused}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.marquee-item{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--fg2);white-space:nowrap;opacity:.5;transition:opacity .2s}
.marquee-item:hover{opacity:1;color:var(--accent)}

/* SECTION */
.section{padding:40px 0}
.section .container{max-width:var(--max-w);margin:0 auto}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.section-title{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.section-link{color:var(--accent);font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;display:flex;align-items:center;gap:4px}

/* CATEGORY CARDS */
.cat-card{width:140px;text-align:center;cursor:pointer;transition:transform .2s}
.cat-card:hover{transform:translateY(-4px)}
.cat-card-img{width:90px;height:90px;border-radius:50%;overflow:hidden;margin:0 auto 8px;border:2px solid var(--border);transition:border-color .2s}
.cat-card:hover .cat-card-img{border-color:var(--accent)}
.cat-card-img img{width:100%;height:100%;object-fit:cover}
.cat-card-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* PRODUCT CARD */
.product-card{width:220px;background:var(--bg2);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;display:flex;flex-direction:column}
.product-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(168,85,247,.1)}
.product-card-img{aspect-ratio:3/4;overflow:hidden;position:relative;background:var(--bg3);flex-shrink:0}
.product-card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.product-card:hover .product-card-img img{transform:scale(1.05)}
.product-badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;z-index:2}
.badge-new{background:var(--accent);color:#fff}
.badge-sale{background:#EF4444;color:#fff}
.badge-pop{background:#fff;color:#0A0A0A}
.product-fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.4);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .2s}
.product-fav:hover,.product-fav.active{background:var(--accent);color:#fff}
.product-fav.active svg{fill:currentColor}
.product-info{padding:12px;display:flex;flex-direction:column;flex:1}
.product-name{font-size:12px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-price{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.price-current{font-size:15px;font-weight:700;color:var(--accent)}
.price-old{font-size:11px;color:var(--fg2);text-decoration:line-through}
.product-colors{display:flex;gap:3px;margin-bottom:8px}
.color-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--border)}
.product-btns{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.product-btns button{width:100%;padding:8px;border-radius:var(--radius-sm);border:none;font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .2s}
.btn-add{background:var(--accent);color:#fff}
.btn-add:hover{background:var(--accent2)}
.btn-wa-sm{background:#25D366;color:#fff}

.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.product-grid .product-card{width:auto}
@media(max-width:480px){.product-grid{grid-template-columns:repeat(2,1fr);gap:10px}}

/* PROMO */
.promo-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}
@media(max-width:640px){.promo-grid{grid-template-columns:1fr}}
.promo-card{background:var(--bg2);border-radius:var(--radius);padding:36px 28px;position:relative;overflow:hidden;cursor:pointer;transition:transform .2s}
.promo-card:hover{transform:translateY(-2px)}
.promo-card::after{content:'';position:absolute;top:0;right:0;width:50%;height:100%;background:linear-gradient(135deg,transparent 0%,rgba(168,85,247,.08) 100%)}
.promo-eyebrow{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.promo-title{font-size:20px;font-weight:800;line-height:1.2;margin-bottom:14px;text-transform:uppercase}
.promo-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1.5px solid var(--fg);border-radius:4px;color:var(--fg);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;background:none;cursor:pointer;position:relative;z-index:1;transition:all .2s}
.promo-btn:hover{border-color:var(--accent);color:var(--accent)}

/* FAQ + MAP COMBO */
.faq-map-section{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:40px 0;align-items:start}
@media(max-width:768px){.faq-map-section{grid-template-columns:1fr;gap:24px}}
.faq-list{width:100%}
.faq-item{border-bottom:1px solid var(--border)}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:16px 0;cursor:pointer;font-size:14px;font-weight:600;gap:12px}
.faq-q .faq-icon{font-size:18px;color:var(--accent);transition:transform .3s;flex-shrink:0}
.faq-q.open .faq-icon{transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease}
.faq-a.open{max-height:200px}
.faq-a-inner{padding:0 0 16px;font-size:13px;color:var(--fg2);line-height:1.7}
.map-side{display:flex;flex-direction:column;gap:16px}
.map-box{background:var(--bg2);border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;border:1px solid var(--border)}
.map-schedule{display:flex;flex-direction:column;gap:8px}
.map-schedule-row{display:flex;align-items:center;gap:10px;font-size:13px}
.map-schedule-row svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.5;flex-shrink:0}

/* FOOTER */
.footer{border-top:1px solid var(--border);padding:40px 0 20px;margin-top:20px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px;margin-bottom:28px}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr;text-align:center}}
.footer-brand .nav-logo{margin-bottom:10px;display:block}
.footer-brand p{color:var(--fg2);font-size:12px;max-width:260px}
@media(max-width:768px){.footer-brand p{margin:0 auto}}
.footer-col h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;color:var(--fg2)}
.footer-col a{display:block;color:var(--fg);text-decoration:none;font-size:12px;padding:3px 0;transition:color .2s;cursor:pointer}
.footer-col a:hover{color:var(--accent)}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--border);font-size:11px;color:var(--fg2);flex-wrap:wrap;gap:12px}
@media(max-width:768px){.footer-bottom{flex-direction:column;text-align:center}}
.footer-socials{display:flex;gap:10px}
.footer-socials a{width:30px;height:30px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none;transition:background .2s}
.footer-socials a:hover{background:var(--accent)}

/* SHOP */
.shop-layout{display:flex;gap:20px}
.shop-sidebar{flex:0 0 240px;padding:16px;background:var(--bg2);border-radius:var(--radius);height:fit-content;position:sticky;top:80px}
@media(max-width:768px){.shop-sidebar{display:none}}
.shop-main{flex:1;min-width:0}
.accordion-header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--border)}
.accordion-header .filter-title{margin:0}
.accordion-icon{transition:transform .3s;font-size:12px;color:var(--fg2)}
.accordion-header.open .accordion-icon{transform:rotate(180deg)}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.accordion-body.open{max-height:500px}
.accordion-body-inner{padding:8px 0}
.filter-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--fg2)}
.filter-option{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:12px}
.filter-option input[type="checkbox"],.filter-option input[type="radio"]{accent-color:var(--accent);width:15px;height:15px}
.filter-option .count{margin-left:auto;color:var(--fg2);font-size:10px}
.filter-section{margin-bottom:8px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;cursor:pointer;font-size:12px}
.toggle-switch{width:36px;height:20px;background:var(--border);border-radius:10px;position:relative;cursor:pointer;transition:background .2s}
.toggle-switch.on{background:var(--accent)}
.toggle-switch::after{content:'';width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .2s}
.toggle-switch.on::after{transform:translateX(16px)}
.price-inputs{display:flex;gap:6px;align-items:center;padding:8px 0}
.price-inputs input{width:70px;padding:7px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:11px;text-align:center}
.price-inputs span{color:var(--fg2);font-size:12px}
.color-filter-grid{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}
.color-filter-btn{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s;padding:2px}
.color-filter-btn:hover,.color-filter-btn.selected{border-color:var(--accent);transform:scale(1.1)}
.color-filter-inner{width:100%;height:100%;border-radius:50%}
.shop-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
@media(max-width:768px){
  .shop-toolbar{position:sticky;top:58px;z-index:50;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--border)}
}
.filter-mobile-btn{display:none;align-items:center;gap:6px;padding:9px 16px;background:var(--accent);color:#fff;border:none;border-radius:50px;font-size:12px;font-weight:600;cursor:pointer}
@media(max-width:768px){.filter-mobile-btn{display:flex}}
.shop-sort select{padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:11px}
.filter-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:flex-end;justify-content:center}
.filter-modal-overlay.open{display:flex}
.filter-modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;padding:20px;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.filter-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.filter-modal-header h3{font-size:16px;font-weight:700}
.filter-modal-header button{background:none;border:none;color:var(--fg);cursor:pointer}
.filter-modal-actions{display:flex;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.btn-clear{flex:1;padding:10px;border-radius:50px;border:1px solid var(--border);background:none;color:var(--fg);font-size:12px;font-weight:600;cursor:pointer}
.btn-apply{flex:2;padding:10px;border-radius:50px;background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer}

/* PRODUCT DETAIL */
.detail-layout{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding:28px 0}
@media(max-width:768px){.detail-layout{grid-template-columns:1fr;gap:20px}}
.detail-gallery{display:flex;gap:10px}
.detail-thumbs{display:flex;flex-direction:column;gap:6px;flex:0 0 56px}
.detail-thumb{width:56px;height:68px;border-radius:var(--radius-sm);overflow:hidden;border:2px solid transparent;cursor:pointer;transition:border-color .2s}
.detail-thumb.active{border-color:var(--accent)}
.detail-thumb img{width:100%;height:100%;object-fit:cover}
.detail-main-img{flex:1;border-radius:var(--radius);overflow:hidden;aspect-ratio:3/4;background:var(--bg3);position:relative;cursor:crosshair}
.detail-main-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.detail-main-img:hover img{transform:scale(1.8)}
.detail-main-img.zooming img{transform-origin:var(--zoom-x,50%) var(--zoom-y,50%)}
@media(max-width:768px){
  .detail-gallery{flex-direction:column-reverse}
  .detail-thumbs{flex-direction:row;flex:none;overflow-x:auto}
  .detail-thumb{width:48px;height:48px;flex:0 0 48px}
  .detail-main-img{aspect-ratio:1/1}
  .detail-main-img:hover img{transform:none}
}
.detail-info{display:flex;flex-direction:column;gap:14px}
.detail-breadcrumb{font-size:11px;color:var(--fg2)}
.detail-breadcrumb span{cursor:pointer}
.detail-breadcrumb span:hover{color:var(--accent)}
.detail-name{font-family:'Playfair Display',serif;font-size:26px;font-weight:700}
.detail-rating{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}
.stars{color:#FBBF24}
.detail-prices{display:flex;align-items:center;gap:10px}
.detail-price-current{font-size:26px;font-weight:800}
.detail-price-old{font-size:14px;color:var(--fg2);text-decoration:line-through}
.detail-discount{background:#EF4444;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.detail-desc{color:var(--fg2);font-size:13px;line-height:1.6}
.detail-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--fg2);margin-bottom:8px}
.size-options{display:flex;gap:6px;flex-wrap:wrap}
.size-btn{padding:9px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:none;color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.size-btn:hover{border-color:var(--accent)}
.size-btn.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.color-options{display:flex;gap:6px}
.color-btn{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s;padding:2px}
.color-btn.selected{border-color:var(--accent)}
.color-btn-inner{width:100%;height:100%;border-radius:50%}
.detail-cta{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.btn-add-lg{width:100%;padding:14px;border-radius:50px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.btn-add-lg:hover{background:var(--accent2)}
.btn-wa-lg{width:100%;padding:14px;border-radius:50px;background:#25D366;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.detail-trust{display:flex;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--border)}
.detail-trust-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg2);padding:6px 12px;background:var(--bg2);border-radius:var(--radius-sm)}
.detail-trust-item svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:1.5}

/* ABOUT & CONTACT */
.page-hero{text-align:center;padding:48px 16px;position:relative}
.page-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(168,85,247,.08) 0%,transparent 70%)}
.page-hero h1{font-family:'Playfair Display',serif;font-size:clamp(26px,4vw,38px);font-weight:700;margin-bottom:8px;position:relative}
.page-hero p{color:var(--fg2);font-size:14px;position:relative;max-width:460px;margin:0 auto}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:28px 0}
@media(max-width:640px){.about-grid{grid-template-columns:1fr}}
.about-block h3{font-size:16px;font-weight:700;margin-bottom:10px}
.about-block p{color:var(--fg2);font-size:13px;line-height:1.7}
.values-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:28px 0}
@media(max-width:640px){.values-grid{grid-template-columns:1fr}}
.value-card{background:var(--bg2);border-radius:var(--radius);padding:24px;text-align:center;border:1px solid var(--border)}
.value-icon{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.value-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.5}
.value-card h4{font-size:14px;font-weight:700;margin-bottom:6px}
.value-card p{font-size:12px;color:var(--fg2);line-height:1.6}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px 0}
@media(max-width:640px){.contact-grid{grid-template-columns:1fr}}
.contact-card{background:var(--bg2);border-radius:var(--radius);padding:28px;border:1px solid var(--border)}
.contact-card h3{font-size:16px;font-weight:700;margin-bottom:16px}
.contact-channel{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .2s}
.contact-channel:last-child{border-bottom:none}
.contact-channel:hover{padding-left:6px}
.channel-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.channel-info h4{font-size:13px;font-weight:600}
.channel-info p{font-size:11px;color:var(--fg2)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;color:var(--fg2)}
.form-group input,.form-group textarea{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--fg);font-size:13px;font-family:inherit}
.form-group textarea{resize:vertical;min-height:90px}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-submit{width:100%;padding:12px;border-radius:50px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s}
.form-submit:hover{background:var(--accent2)}

/* CART DRAWER */
.cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400}
.cart-overlay.open{display:block}
.cart-drawer{position:fixed;top:0;right:0;width:360px;max-width:100%;height:100%;background:var(--bg);z-index:401;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cart-drawer.open{transform:translateX(0)}
.cart-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border)}
.cart-header h3{font-size:16px;font-weight:700}
.cart-header button{background:none;border:none;color:var(--fg);cursor:pointer}
.cart-items{flex:1;overflow-y:auto;padding:12px 0}
.cart-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.cart-item-img{width:56px;height:70px;border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:12px;font-weight:600;margin-bottom:2px}
.cart-item-meta{font-size:10px;color:var(--fg2)}
.cart-item-price{font-size:13px;font-weight:700;color:var(--accent);margin-top:2px}
.cart-item-qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--fg);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.cart-item-remove{background:none;border:none;color:var(--fg2);cursor:pointer;font-size:11px;margin-top:2px}
.cart-item-remove:hover{color:#EF4444}
.cart-footer{border-top:1px solid var(--border);padding-top:12px}
.cart-total{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:12px}
.cart-total .amount{color:var(--accent);font-size:18px}
.btn-wa-checkout{width:100%;padding:14px;border-radius:50px;background:#25D366;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.cart-empty{text-align:center;padding:48px 16px;color:var(--fg2)}
.cart-empty p{margin:12px 0}
.btn-go-shop{display:inline-flex;padding:10px 20px;border-radius:50px;background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;margin-top:8px}
.fav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400}
.fav-overlay.open{display:block}
.fav-drawer{position:fixed;top:0;right:0;width:360px;max-width:100%;height:100%;background:var(--bg);z-index:401;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.fav-drawer.open{transform:translateX(0)}
.fav-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
.fav-item-img{width:56px;height:70px;border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0}
.fav-item-img img{width:100%;height:100%;object-fit:cover}
.fav-item-info{flex:1}
.fav-item-name{font-size:12px;font-weight:600}
.fav-item-price{font-size:13px;font-weight:700;color:var(--accent)}
.fav-item-actions{display:flex;gap:6px}
.fav-to-cart{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:6px 10px;font-size:10px;font-weight:600;cursor:pointer}
.fav-remove{background:none;border:none;color:var(--fg2);cursor:pointer;padding:6px}
.btn-fav-all{width:100%;padding:12px;border-radius:50px;background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;margin-top:12px}

/* FLOATING WA */
.wa-float{position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;border:none;cursor:pointer;z-index:300;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(37,211,102,.4);transition:transform .2s;padding-right:0}
.wa-float:hover{transform:scale(1.1)}
@media(max-width:768px){.wa-float{bottom:16px;right:16px;width:48px;height:48px}}

/* ADMIN */
.admin-wrap{max-width:1000px;margin:0 auto;padding:20px 0}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.admin-header h1{font-size:22px;font-weight:700}
.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.stat-value{font-size:28px;font-weight:800;color:var(--accent)}
.stat-label{font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.admin-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.admin-section-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.admin-section-header h3{font-size:14px;font-weight:700}
.admin-table{width:100%;border-collapse:collapse;font-size:12px}
.admin-table th{text-align:left;padding:10px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--fg2);border-bottom:1px solid var(--border)}
.admin-table td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.admin-table tr:last-child td{border-bottom:none}
.admin-table img{width:40px;height:50px;object-fit:cover;border-radius:4px}
.admin-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;text-transform:uppercase}
.admin-badge-active{background:rgba(34,197,94,.15);color:#22C55E}
.admin-badge-draft{background:rgba(168,85,247,.15);color:var(--accent)}
.admin-actions button{background:none;border:none;color:var(--fg2);cursor:pointer;padding:4px;margin:0 2px}
.admin-actions button:hover{color:var(--accent)}
.admin-config{padding:20px}
.admin-config-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
.admin-config-row:last-child{border-bottom:none}
.admin-config-row label{color:var(--fg2);font-size:12px}
.admin-config-row input[type="text"],.admin-config-row input[type="tel"]{padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:12px;width:220px}
.admin-btn{padding:8px 16px;border-radius:50px;border:none;font-size:11px;font-weight:600;cursor:pointer}
.admin-btn-primary{background:var(--accent);color:#fff}
.admin-btn-outline{background:none;border:1px solid var(--border);color:var(--fg)}

function renderTopbar(){
  return `<div class="topbar full-bleed" id="topbar">${TOPBAR_MSGS.map((m,i)=>`<div class="topbar-msg${i===0?' active':''}" data-tb="${i}" style="background:${m.bg}">${m.text}</div>`).join('')}</div>`;
}

function startTopbar(){
  if(topbarTimer)clearInterval(topbarTimer);
  topbarIdx=0;
  topbarTimer=setInterval(()=>{
    const tb=document.getElementById('topbar');if(!tb)return;
    const msgs=tb.querySelectorAll('.topbar-msg');
    const cur=msgs[topbarIdx];
    if(cur){cur.classList.remove('active');cur.classList.add('exit')}
    topbarIdx=(topbarIdx+1)%TOPBAR_MSGS.length;
    const nxt=msgs[topbarIdx];
    setTimeout(()=>{
      if(cur)cur.classList.remove('exit');
      if(nxt)nxt.classList.add('active');
    },400);
  },3500);
}

function carousel(id,items){
  return `<div class="carousel-wrap" id="cw-${id}">

    <button class="carousel-arrow next" id="an-${id}" onclick="scrollCar('${id}',1)">${I.right}</button>
  </div>`;
}

function getFiltered(){let l=[...PRODS];if(filters.cat!=='all')l=l.filter(p=>p.cat===filters.cat);if(filters.onSale)l=l.filter(p=>p.badge==='sale');if(filters.color)l=l.filter(p=>p.colors&&p.colors.some(c=>c.toLowerCase()===filters.color.toLowerCase()));l=l.filter(p=>p.price>=filters.minP&&p.price<=filters.maxP);if(filters.sort==='pa')l.sort((a,b)=>a.price-b.price);if(filters.sort==='pd')l.sort((a,b)=>b.price-a.price);if(filters.sort==='name')l.sort((a,b)=>a.name.localeCompare(b.name));return l}

function closeFM(){document.getElementById('fm').classList.remove('open')}
function addToCart(id){const p=PRODS.find(x=>x.id===id);if(!p)return;const e=cart.find(x=>x.id===id);if(e)e.qty++;else cart.push({...p,qty:1});render();toggleCart()}
function addToCartSilent(id){const p=PRODS.find(x=>x.id===id);if(!p)return;const e=cart.find(x=>x.id===id);if(e)e.qty++;else cart.push({...p,qty:1});render();document.getElementById('fo').classList.add('open');document.getElementById('fd').classList.add('open')}
function addAllFavsToCart(){favs.forEach(id=>{const p=PRODS.find(x=>x.id===id);if(!p)return;const e=cart.find(x=>x.id===id);if(e)e.qty++;else cart.push({...p,qty:1})});favs=[];render();toggleCart()}
function chgQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);render();document.getElementById('co').classList.add('open');document.getElementById('cd').classList.add('open')}
function rmCart(i){cart.splice(i,1);render();document.getElementById('co').classList.add('open');document.getElementById('cd').classList.add('open')}
function toggleFavItem(id){const i=favs.indexOf(id);if(i>-1)favs.splice(i,1);else favs.push(id);render()}
function consultWA(id){const p=PRODS.find(x=>x.id===id);if(!p)return;const m=encodeURIComponent(`Hola ${STORE} 👋 Me interesa: ${p.name} (S/ ${p.price.toFixed(2)}). ¿Disponible?`);window.open(`https://wa.me/${PHONE}?text=${m}`,'_blank')}
function sendWA(){if(!cart.length)return;let items=cart.map(i=>`• ${i.name} x${i.qty} — S/ ${(i.price*i.qty).toFixed(2)}`).join('\n');const t=cart.reduce((s,i)=>s+i.price*i.qty,0);const m=encodeURIComponent(`Hola ${STORE} 👋\n\nPedido:\n${items}\n\nTotal: S/ ${t.toFixed(2)}\n\n¿Medios de pago y envío?`);window.open(`https://wa.me/${PHONE}?text=${m}`,'_blank')}
function scrollCar(id,dir){const t=document.getElementById('ct-'+id);if(!t)return;const item=t.children[0];if(!item)return;const w=item.offsetWidth+16;t.scrollBy({left:dir*w*2,behavior:'smooth'})}
function checkArrowsFor(id){const t=document.getElementById('ct-'+id),ap=document.getElementById('ap-'+id),an=document.getElementById('an-'+id);if(!t||!ap||!an)return;const has=t.scrollWidth>t.clientWidth+4;if(!has){ap.classList.remove('visible');an.classList.remove('visible');return}ap.classList.toggle('visible',t.scrollLeft>4);an.classList.toggle('visible',t.scrollLeft<t.scrollWidth-t.clientWidth-4)}
function checkArrows(){['cats','new','pop','rel'].forEach(id=>checkArrowsFor(id))}
function initCarousels(){setTimeout(checkArrows,100);window.addEventListener('resize',checkArrows)}
function initZoom(){document.querySelectorAll('[data-zoom]').forEach(el=>{el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();el.style.setProperty('--zoom-x',((e.clientX-r.left)/r.width*100)+'%');el.style.setProperty('--zoom-y',((e.clientY-r.top)/r.height*100)+'%');el.classList.add('zooming')});el.addEventListener('mouseleave',()=>{el.classList.remove('zooming')})})}
function initAccordions(){document.querySelectorAll('[data-acc-toggle]').forEach(h=>{h.addEventListener('click',()=>{h.classList.toggle('open');h.nextElementSibling.classList.toggle('open')})})}
function initFaqs(){document.querySelectorAll('[data-faq]').forEach(q=>{q.addEventListener('click',()=>{q.classList.toggle('open');document.getElementById('faq-'+q.dataset.faq).classList.toggle('open')})})}

render();
</script>
</body></html>
